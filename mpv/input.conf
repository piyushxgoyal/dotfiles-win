# Scene/Chapter Navigation
Alt+z add chapter +1
Alt+Shift+z add chapter -1

# Playback Controls
space cycle pause
left seek -10
right seek 8
shift+left seek -3
shift+right seek 3
ctrl+left seek -60
ctrl+right seek 60

# Volume & Playback Speed
up add volume 5
down add volume -5
= add speed 0.1
- add speed -0.1
0 set speed 1.0

# Audio & Subtitle Tracks
b cycle audio
v cycle sub
c cycle sub down

# Material OSC migration:
# ctrl+d ...                     # subtitle downloader, revisit
# mbtn_right ...                 # Material OSC handles this
# alt+c ...                      # subtitle dialog, revisit
# alt+b ...                      # audio dialog, revisit
# t ...                          # uosc-only visual action, removed

# Playlist navigation
] playlist-next
[ playlist-prev

# Back to beginning
BS seek 0 absolute
